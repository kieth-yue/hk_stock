name: hk_news

on:
  schedule:
    # ========== Pool2（250隻 GLM）HKT 06:00/12:30/21:00 周一至周五 ==========
    - cron: '0 22 * * 0-4'    # HKT 06:00（UTC前一日22:00，周日-周四對應HKT周一-周五）
    - cron: '30 4 * * 1-5'    # HKT 12:30（UTC 04:30，周一-周五）
    - cron: '0 13 * * 1-5'    # HKT 21:00（UTC 13:00，周一-周五）
    # ========== Pool1（300隻 Gemini）HKT 07:30/11:10/23:00 周一至周五 ==========
    - cron: '30 23 * * 0-4'   # HKT 07:30（UTC前一日23:30，周日-周四對應HKT周一-周五）
    - cron: '10 3 * * 1-5'    # HKT 11:10（UTC 03:10，周一-周五）
    - cron: '0 15 * * 1-5'    # HKT 23:00（UTC 15:00，周一-周五）
  workflow_dispatch: # 手動觸發：自動跑config開了的池，方便測試

# 全局串行鎖：同一時間只跑一個任務，新任務排隊等，絕不斬斷正在爬的任務
concurrency:
  group: hk-news-global-serial
  cancel-in-progress: false

jobs:
  scan_task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 配置Python3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴套件
        run: pip install -r requirements.txt

      - name: 還原推送緩存（兩個池的去重記錄自動持久化）
        uses: actions/cache@v4
        with:
          path: push_cache_*.json
          key: ${{ runner.os }}-hk-stock-dual-pool-cache

      - name: 執行掃描與AI分析
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          STOCK_POOL: ${{ secrets.STOCK_POOL }}
          STOCK_POOL_2: ${{ secrets.STOCK_POOL_2 }}
          AASTOCKS_RSS_BASE: ${{ secrets.AASTOCKS_RSS_BASE }}
          GOOGLE_NEWS_RSS_BASE: ${{ secrets.GOOGLE_NEWS_RSS_BASE }}
        run: python main.py
