name: hk_news

on:
  schedule:
    # 全部用整數時間，合法cron語法，一定會正常啟動，每日5次，HKT周一至周五
    - cron: '0 22 * * 0-4'    # HKT 06:00 開市前
    - cron: '0 3 * * 1-5'     # HKT 11:00 午間
    - cron: '0 8 * * 1-5'     # HKT 16:00 收市後
    - cron: '0 13 * * 1-5'    # HKT 21:00 晚間
    - cron: '30 15 * * 1-5'   # HKT 23:30 睡前最後一次
  workflow_dispatch: # 手動觸發

concurrency:
  group: hk-news-global-serial
  cancel-in-progress: false

jobs:
  scan_task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 配置Python3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: pip install requests feedparser pyyaml python-dateutil beautifulsoup4 google-genai
      - name: 還原推送緩存
        uses: actions/cache@v4
        with:
          path: push_cache_*.json
          key: ${{ runner.os }}-hk-stock-dual-pool-cache
      - name: 執行掃描
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_POOL: ${{ secrets.STOCK_POOL }}
          STOCK_POOL_2: ${{ secrets.STOCK_POOL_2 }}
          AASTOCKS_RSS_BASE: ${{ secrets.AASTOCKS_RSS_BASE }}
          GOOGLE_NEWS_RSS_BASE: ${{ secrets.GOOGLE_NEWS_RSS_BASE }}
        run: python main.py
