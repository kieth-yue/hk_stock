name: hk_news

on:
  schedule:
    # HKT 07:00 周一至周五
    - cron: '0 23 * * 0-4'
    # HKT 09:30 周一至周五
    - cron: '30 1 * * 1-5'
    # HKT 12:30 周一至周五
    - cron: '30 4 * * 1-5'
    # HKT 21:00 周一至周五
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # 手動觸發：直接跑兩個池

# 全局串行鎖
concurrency:
  group: hk-news-global-serial
  cancel-in-progress: false

jobs:
  scan_task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 配置Python3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴套件
        run: pip install requests feedparser pyyaml python-dateutil beautifulsoup4 google-genai

      - name: 還原推送緩存
        uses: actions/cache@v4
        with:
          path: push_cache_*.json
          key: ${{ runner.os }}-hk-stock-dual-pool-cache

      - name: 執行掃描（先300隻再250隻）
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STOCK_POOL: ${{ secrets.STOCK_POOL }}
          STOCK_POOL_2: ${{ secrets.STOCK_POOL_2 }}
          AASTOCKS_RSS_BASE: ${{ secrets.AASTOCKS_RSS_BASE }}
          GOOGLE_NEWS_RSS_BASE: ${{ secrets.GOOGLE_NEWS_RSS_BASE }}
        run: python main.py
